<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 化学反応ラボ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Hiragino Kaku Gothic Pro',sans-serif;background:#07101f;color:#dde8ff;min-height:100vh;overflow-x:hidden}
#hdr{background:linear-gradient(135deg,#111e3d,#0a1528);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e3060;position:sticky;top:0;z-index:10;gap:10px;flex-wrap:wrap}
.app-title{font-size:1.25em;font-weight:bold;white-space:nowrap}.app-title span{color:#50c8ff}
.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stat{font-size:.85em}.stat-val{color:#ffd060;font-weight:bold;font-size:1.1em}
.pbwrap{width:100px;height:7px;background:#0d1830;border-radius:4px;overflow:hidden}
.pb{height:100%;background:linear-gradient(90deg,#30b060,#60e090);border-radius:4px;transition:width .5s}
#main{display:grid;grid-template-columns:285px 1fr;height:calc(100vh - 52px)}
#left{background:#0b162a;border-right:1px solid #1a2e50;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.sec{font-size:.72em;color:#506080;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
/* Search */
.swrap{position:relative;margin-bottom:4px}
.sinput{width:100%;background:#0d1d38;border:1px solid #2a3860;border-radius:8px;padding:7px 28px 7px 28px;color:#dde8ff;font-size:.85em;outline:none}
.sinput:focus{border-color:#4070d0}
.sinput::placeholder{color:#405060}
.sicon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.85em;pointer-events:none}
.sclear{position:absolute;right:7px;top:50%;transform:translateY(-50%);color:#506080;cursor:pointer;font-size:.8em;padding:2px 4px;border-radius:4px;display:none}
.sclear:hover{color:#dde8ff;background:#1e3060}
.sbadge{font-size:.68em;color:#7090b0;display:none;margin-bottom:4px}
/* Grid */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;min-height:20px}
.mempty{font-size:.75em;color:#304060;text-align:center;padding:10px;grid-column:1/-1}
.mcard{background:#101d35;border:1px solid #1e3358;border-radius:7px;padding:6px 3px 5px;text-align:center;cursor:grab;transition:all .15s;user-select:none}
.mcard:hover{background:#182a4a;border-color:#3060b0;transform:scale(1.05)}
.mcard.flash{background:#1a4030;border-color:#40c080}
.mcard.dragging{opacity:.4}
.mcard.newmol{animation:unlock .7s ease-out}
@keyframes unlock{0%{transform:scale(.4);opacity:0;border-color:#60ff90;background:#0a3020}60%{transform:scale(1.15);border-color:#60ff90}100%{transform:scale(1);opacity:1}}
.msym{font-size:.95em;font-weight:bold;color:#70d0ff;line-height:1.1;word-break:break-all}
.msym.sm{font-size:.72em}
.mnm{font-size:.55em;color:#50708a;margin-top:2px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Reaction zone */
.rzone{background:#09142a;border:1px solid #1a2e50;border-radius:12px;padding:10px}
/* ★ CSS grid で + が消えない固定レイアウト ★ */
.srow{display:grid;grid-template-columns:1fr 24px 1fr;gap:4px;align-items:center;margin-bottom:10px}
.slot{background:#0d1d38;border:2px dashed #2a4070;border-radius:9px;min-height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;padding:5px 3px;overflow:hidden}
.slot.filled{border-style:solid;border-color:#30a060;background:#0a2018}
.slot.dragover{border-color:#60e0a0!important;background:#102a1a!important;box-shadow:0 0 14px rgba(60,220,120,.45);transform:scale(1.05)}
.shint{font-size:.6em;color:#304060;text-align:center;line-height:1.4}
.ssym{font-size:1em;font-weight:bold;color:#70d0ff;word-break:break-all;text-align:center;line-height:1.1;width:100%}
.ssym.sm{font-size:.75em}
.snm{font-size:.55em;color:#50708a;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.srem{position:absolute;top:-7px;right:-7px;width:18px;height:18px;background:#c03040;border-radius:50%;font-size:.7em;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-weight:bold;z-index:5}
.plus{text-align:center;color:#3a5888;font-size:1.1em;font-weight:bold}
/* Conditions */
.crow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.cbtn{background:#0d1d38;border:1px solid #1e3358;border-radius:7px;padding:6px 2px 4px;text-align:center;cursor:pointer;transition:all .15s}
.cbtn:hover{background:#162a48}
.cbtn.on{background:#102a18;border-color:#30c060}
.cico{font-size:1.15em}.clbl{font-size:.58em;color:#506080;margin-top:2px}
.cbtn.on .clbl{color:#50c080}
.rbtn{width:100%;padding:11px;background:linear-gradient(135deg,#155030,#0a3a20);border:2px solid #30b060;border-radius:9px;color:#70ffb0;font-size:1em;font-weight:bold;cursor:pointer;letter-spacing:1px;transition:all .2s}
.rbtn:hover{background:linear-gradient(135deg,#206040,#155030);box-shadow:0 0 12px rgba(50,200,100,.3)}
.rbtn:active{transform:scale(.97)}
/* Misc left panel */
.hint{background:#0d1d32;border:1px dashed #253a58;border-radius:7px;padding:7px 9px;font-size:.72em;color:#4a6888;line-height:1.5}
.legrow{display:flex;flex-wrap:wrap;gap:5px}
.legitem{display:flex;align-items:center;gap:4px;font-size:.68em;color:#506080}
.legdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dlog{max-height:120px;overflow-y:auto}
.ditem{font-size:.7em;color:#607090;padding:3px 0;border-bottom:1px solid #101e38;line-height:1.3}
.ditem:first-child{color:#60d0a0}
.dempty{font-size:.75em;color:#304060}
/* Product cards */
.pcards{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pcard{background:#0c2a1a;border:2px solid #30a060;border-radius:9px;padding:6px 10px;cursor:grab;transition:all .18s;text-align:center;min-width:58px}
.pcard:hover{background:#14402a;border-color:#50d080;transform:scale(1.06)}
.pcard.dragging{opacity:.4}
.psym{font-size:1em;font-weight:bold;color:#70ffb0;word-break:break-all}
.psym.sm{font-size:.75em}
.pnm{font-size:.6em;color:#508060;margin-top:1px}
.phint{font-size:.56em;color:#30a060;margin-top:2px}
/* Stoich note */
.snote{background:#0a2030;border-left:3px solid #4090c0;border-radius:0 7px 7px 0;padding:7px 10px;margin-top:7px;font-size:.78em;color:#70b0d0;line-height:1.6}
/* Right panel */
#right{display:flex;flex-direction:column;overflow:hidden}
#vwrap{flex:1;position:relative;min-height:260px;background:radial-gradient(ellipse at center,#0d1a35 0%,#07101f 100%)}
#threecanvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#atomlbls{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.albl{position:absolute;font-size:.68em;color:rgba(200,220,255,.9);font-weight:bold;transform:translate(-50%,-50%);text-shadow:0 0 4px #000;pointer-events:none}
#mollbl{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(7,16,31,.85);border:1px solid #1e3060;border-radius:20px;padding:4px 14px;font-size:.8em;color:#8090b0;pointer-events:none;white-space:nowrap;max-width:90%;text-align:center}
#rxfx{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4em;pointer-events:none;display:none;z-index:20}
#info{background:#0a1528;border-top:1px solid #1a2e50;padding:12px 16px;min-height:110px;flex-shrink:0;overflow-y:auto;max-height:38vh}
.iph{color:#304060;font-size:.85em}
.req{font-size:1em;color:#ffd060;font-family:monospace;margin-bottom:4px}
.rname{font-size:1.1em;font-weight:bold;color:#70ffb0;margin-bottom:4px}
.rdesc{font-size:.82em;color:#8099b8;line-height:1.55}
.rpts{display:inline-block;background:#1a1a08;border:1px solid #c0a030;border-radius:20px;padding:2px 11px;color:#ffd060;font-size:.78em;margin-top:6px}
.nrxn{color:#c07060;font-size:.85em;line-height:1.5}
.pcslbl{font-size:.72em;color:#506080;margin-top:8px;text-transform:uppercase;letter-spacing:1px}
/* D&D ghost */
#ghost{position:fixed;pointer-events:none;z-index:9999;background:#1a4a2a;border:2px solid #50e090;border-radius:10px;padding:7px 12px;text-align:center;opacity:.88;transform:translate(-50%,-130%) scale(1.1);box-shadow:0 6px 24px rgba(0,0,0,.5);display:none;min-width:58px}
#ghost .gs{font-size:1em;font-weight:bold;color:#70ffb0;word-break:break-all}
#ghost .gn{font-size:.6em;color:#50a070;margin-top:2px}
/* Toast */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0c2a18;border:2px solid #30c060;border-radius:12px;padding:9px 20px;font-size:.9em;color:#70ffb0;z-index:200;display:none;text-align:center;box-shadow:0 4px 24px rgba(0,200,100,.25);max-width:92vw}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* ── molinfo overlay ── */
@keyframes mifi{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
#molinfo{position:absolute;top:10px;right:10px;background:rgba(6,14,28,.92);border:1px solid #2a5090;border-radius:12px;padding:10px 14px;max-width:240px;pointer-events:none;z-index:15;display:none}
#molinfo.show{display:block;animation:mifi .45s ease-out}
.mi-sym{font-size:1.15em;font-weight:bold;color:#70ffb0;margin-bottom:2px}
.mi-name{font-size:.7em;color:#50a878;margin-bottom:5px}
.mi-desc{font-size:.7em;color:#a8c2e0;line-height:1.6}
.mi-rxn{font-size:.68em;color:#6090b0;margin-top:5px;border-top:1px solid #1e3060;padding-top:4px;line-height:1.5}
/* ── save indicator ── */
#saveind{position:fixed;bottom:12px;right:14px;font-size:.75em;color:#50a878;pointer-events:none;z-index:100;transition:opacity .4s}
#saveind.hide{opacity:0}
/* ── view toggle ── */
#viewtoggle{position:absolute;top:10px;left:10px;background:rgba(10,22,44,.85);border:1px solid #1a3060;border-radius:8px;padding:5px 9px;color:#70a0d0;font-size:.72em;cursor:pointer;z-index:16;-webkit-tap-highlight-color:transparent}
#viewtoggle:hover{background:rgba(20,40,80,.95);color:#90c8ff}
/* ── 2D structural formula ── */
#struct2d{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#07101f}
/* ── drop3d overlay ── */
#drop3d{display:none;position:absolute;bottom:22%;left:50%;transform:translateX(-50%);background:rgba(7,16,31,.82);border:1px solid #1e3060;border-radius:12px;padding:10px 14px;z-index:25;flex-direction:row;align-items:center;gap:7px}
.d3slot{background:#0d1d38;border:2px dashed #2a4070;border-radius:8px;min-width:64px;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:.65em;color:#304060;transition:all .15s;cursor:pointer}
.d3slot.filled{border-style:solid;border-color:#30a060;background:#0a2018;color:#70d0a0}
.d3slot.dragover{border-color:#60e0a0!important;background:#102a1a!important;transform:scale(1.05)}
.d3plus{color:#3a5888;font-size:1em;font-weight:bold}
/* ── molecule card: simple ── */
.mcard{background:#101d35;border:1px solid #1e3358;border-radius:6px;padding:5px 6px;cursor:grab;transition:all .15s;user-select:none;display:flex;align-items:center}
.mcard:hover{background:#182a4a;border-color:#3060b0}
.mcard.flash{background:#1a4030;border-color:#40c080}
.mcard.dragging{opacity:.4}
.mcard.newmol{animation:unlock .7s ease-out}
.mcard-line{font-size:.75em;color:#a8c8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
/* ── srow for 3 slots ── */
.srow{display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr;gap:3px;align-items:center;margin-bottom:10px}
/* ── reaction log taller ── */
.dlog{max-height:240px;overflow-y:auto}
.ditem{font-size:.7em;color:#607090;padding:4px 0;border-bottom:1px solid #101e38;line-height:1.3;cursor:pointer;transition:color .15s}
.ditem:first-child{color:#60d0a0}
.ditem:hover{color:#90d0ff}
/* ── drawer toggle (desktop: hidden) ── */
#drawtoggle{display:none}
/* ── mobile sec-tabs ── */
#sec-tabs{display:none;gap:4px;flex-shrink:0;margin-bottom:4px}
.stab{flex:1;padding:7px 4px;background:#0d1d38;border:1px solid #1e3358;border-radius:7px;color:#506080;font-size:.65em;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.stab.active{background:#102a18;border-color:#30c060;color:#60d090}
/* ═══ MOBILE LAYOUT ═══════════════════════════════════════ */
@media(max-width:700px){
  body{overflow:hidden}
  #hdr{padding:7px 12px;gap:6px}
  .app-title{font-size:1em}
  .stats{gap:6px;font-size:.75em}
  .pbwrap{width:60px}
  /* メインを縦フレックスに：上=ドロワー、下=3D+反応バー */
  #main{display:flex;flex-direction:column;position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden}
  /* ドロワー：閉=0px、開=44vh */
  #left{flex-shrink:0;height:0;overflow:hidden;background:rgba(8,16,34,.96);
    transition:height .25s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;gap:6px}
  #left.open{height:44vh;overflow-y:auto;border-bottom:1px solid #1a3060;padding:8px}
  /* 3D + 反応バー */
  #right{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #vwrap{flex:1;min-height:0;position:relative}
  #info{display:none}
  /* 反応バーは#rightの末尾 */
  #sec-rxn{flex-shrink:0;background:rgba(8,16,32,.92);border-top:1px solid #1a3060;padding:7px 10px 8px;display:block!important}
  /* ドロワートグル：#vwrap内 左上 */
  #drawtoggle{position:absolute;top:6px;left:6px;z-index:20;background:rgba(10,22,44,.88);
    border:1px solid #1a3060;border-radius:8px;padding:6px 10px;color:#5a7898;
    font-size:1.2em;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center}
  #drawtoggle.active{color:#50c8ff;border-color:#2a5090;background:rgba(20,50,90,.97)}
  /* 構造式ボタン：右上 */
  #viewtoggle{top:6px!important;left:auto!important;right:6px!important;font-size:.65em;padding:5px 8px}
  /* molinfoは重なりを避ける */
  #molinfo{top:48px!important;right:6px!important;max-width:58vw}
  /* ドロワー内：凡例非表示、タブ非表示 */
  #sec-leg{display:none!important}
  #sec-tabs{display:none!important}
  /* 物質グリッド：1列、スクロール可能 */
  .mgrid{grid-template-columns:1fr;gap:4px}
  #sec-mol{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  /* 反応ゾーン compact */
  .srow{gap:2px}
  .slot{min-height:52px}
  .ssym{font-size:.85em}.snm{font-size:.48em}
  .srem{width:16px;height:16px;font-size:.65em}
  .crow{grid-template-columns:repeat(5,1fr);gap:3px}
  .cbtn{padding:7px 2px 5px}
  .cico{font-size:1em}.clbl{font-size:.55em}
  .rbtn{padding:10px;font-size:.9em}
  .rzone{padding:7px}
  .dlog{max-height:140px}
  #saveind{bottom:8px;right:10px;font-size:.7em}
}
</style>
</head>
<body>
<div id="hdr">
  <div class="app-title">🧪 <span>化学反応</span>ラボ</div>
  <div class="stats">
    <div class="stat">スコア：<span class="stat-val" id="score">0</span></div>
    <div class="stat" style="display:flex;align-items:center;gap:6px;">
      反応 <span id="dcnt">0</span>/<span id="tcnt">?</span>
      <div class="pbwrap"><div class="pb" id="pb" style="width:0%"></div></div>
    </div>
    <div class="stat" style="color:#8090b0;font-size:.8em;">物質 <span id="mcnt">7</span> 種</div>
    <button onclick="resetState()" style="background:#0d1d38;border:1px solid #2a3860;border-radius:6px;color:#506080;font-size:.75em;padding:4px 9px;cursor:pointer">🗑 リセット</button>
  </div>
</div>

<div id="main">
<div id="left">
  <div id="sec-tabs"><button class="stab active" data-sec="mol" onclick="showDrawerSec('mol')">🔬 物質</button><button class="stab" data-sec="log" onclick="showDrawerSec('log')">📖 記録</button></div>
  <div id="sec-mol">
    <div class="sec">🔬 発見した物質（<span id="acnt">7</span>種 / 全<span id="totalMols">?</span>種）</div>
    <div class="swrap">
      <span class="sicon">🔍</span>
      <input type="text" id="search" class="sinput" placeholder="検索… 例：H2O、水、エタノール">
      <span class="sclear" id="sclear">✕</span>
    </div>
    <div class="sbadge" id="sbadge"></div>
    <div class="mgrid" id="mgrid"></div>
  </div>
  <div id="sec-rxn">
    <div class="sec">⚗️ 反応させる</div>
    <div class="rzone">
      <div class="srow" id="srow"></div>
      <div class="sec">🌡️ 条件</div>
      <div class="crow" id="crow"></div>
      <button class="rbtn" id="rbtn">⚡ 反応させる！</button>
    </div>
  </div>
  <div id="sec-hint">
    <div class="sec">💡 ヒント</div>
    <div class="hint" id="hint">まず同じ原子を2つスロットに入れて「電気」で反応させてみよう！ 例：H + H → H₂</div>
  </div>
  <div id="sec-leg">
    <div class="sec">🎨 原子の色</div>
    <div class="legrow" id="leg"></div>
  </div>
  <div id="sec-log">
    <div class="sec">📖 発見した反応</div>
    <div class="dlog" id="dlog"><div class="dempty">まだ何も発見していません…</div></div>
  </div>
</div>

<div id="right">
  <div id="vwrap">
    <canvas id="threecanvas"></canvas>
    <div id="atomlbls"></div>
    <div id="mollbl">物質を選んで反応させてみよう！</div>
    <div id="rxfx">🔥</div>
    <div id="drawtoggle" onclick="toggleDrawer()">☰</div>
    <div id="molinfo"><div class="mi-sym" id="mi-sym"></div><div class="mi-name" id="mi-name"></div><div class="mi-desc" id="mi-desc"></div><div class="mi-rxn" id="mi-rxn"></div></div>
    <svg id="struct2d" xmlns="http://www.w3.org/2000/svg"></svg>
    <button id="viewtoggle" onclick="toggleView()">📐 構造式</button>
    <div id="drop3d"><div class="d3slot" data-idx="0" id="d3s0">スロット1</div><div class="d3plus">+</div><div class="d3slot" data-idx="1" id="d3s1">スロット2</div><div class="d3plus">+</div><div class="d3slot" data-idx="2" id="d3s2">スロット3</div></div>
  </div>
  <div id="info"><div class="iph">← 物質をスロットに入れて「反応させる！」を押してください<br><span style="font-size:.8em;color:#304060">まずは H + H → H₂（電気）から始めよう</span></div></div>
</div>
</div>

<div id="saveind"></div>
<div id="toast"></div>
<div id="ghost"><div class="gs" id="gs"></div><div class="gn" id="gn"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── HELPERS ──────────────────────────────────────────────────
function mk(a){ return a.slice().sort().join('+'); }
function ns(s){
  if(!s) return '';
  return String(s).toLowerCase()
    .replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/₃/g,'3')
    .replace(/₄/g,'4').replace(/₅/g,'5').replace(/₆/g,'6').replace(/₇/g,'7')
    .replace(/₈/g,'8').replace(/₉/g,'9').replace(/ₙ/g,'n').replace(/[()]/g,'');
}

// ─── ELEMENTS ─────────────────────────────────────────────────
var ELEM = {
  H:  {color:0xffffff,r:.30,label:'水素 H',   hex:'#ffffff'},
  O:  {color:0xff3030,r:.40,label:'酸素 O',   hex:'#ff4040'},

var dragKey = null;
var ghost = document.getElementById('ghost');
var gsEl   = document.getElementById('gs');
var gnEl   = document.getElementById('gn');
var tdKey = null, tdEl = null;

function makeDrag(el, key) {
  el.setAttribute('draggable','true');
  el.addEventListener('dragstart', function(e){
    dragKey = key;
    e.dataTransfer.setData('text/plain', key);
    e.dataTransfer.effectAllowed = 'copy';
    el.classList.add('dragging');
    showDrop3d();
  });
  el.addEventListener('dragend', function(){ dragKey=null; el.classList.remove('dragging'); hideDrop3d(); });
  el.addEventListener('touchstart', function(e){
    // モバイルのスクロールリスト内はD&D無効（スクロール優先）
    if(window.innerWidth<=700 && el.closest && el.closest('#sec-mol')) return;
    tdKey=key; tdEl=el; el.classList.add('dragging');
    var m=MOLS[key];
    gsEl.textContent=m.sym; gnEl.textContent=m.ja;
    movGhost(e.touches[0]); ghost.style.display='block';
  },{passive:true});
  el.addEventListener('touchmove', function(e){ movGhost(e.touches[0]); e.preventDefault(); },{passive:false});
  el.addEventListener('touchend', function(e){
    ghost.style.display='none';
    if(tdEl) tdEl.classList.remove('dragging');
    if(!tdKey){ tdKey=null; tdEl=null; return; }
    var t=e.changedTouches[0];
    var tgt=document.elementFromPoint(t.clientX,t.clientY);
    var sl=tgt&&(tgt.classList.contains('slot')?tgt:(tgt.parentElement&&tgt.parentElement.classList.contains('slot')?tgt.parentElement:null));
    var d3sl=tgt&&(tgt.classList.contains('d3slot')?tgt:(tgt.parentElement&&tgt.parentElement.classList.contains('d3slot')?tgt.parentElement:null));
    var vwEl=document.getElementById('vwrap');
    var inVw=false;

function buildScene(keys){
  while(molGroup.children.length){var c=molGroup.children[0];if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();molGroup.remove(c);}
  atms=[];
  var valid=keys.filter(function(k){return k&&MOLS[k];});
  if(!valid.length){document.getElementById('atomlbls').innerHTML='';document.getElementById('mollbl').textContent='物質を選んでください';return;}
  var n=valid.length,sc=n===1?1.2:.8,sp2=n===1?0:3.2;
  for(var mi=0;mi<valid.length;mi++){
    var key=valid[mi],mol=MOLS[key],ox=(mi-(n-1)/2)*sp2;
    for(var ai=0;ai<mol.atoms.length;ai++){
      var a=mol.atoms[ai],ed=ELEM[a.e]||{color:0x808080,r:.35};
      var geo=new THREE.SphereGeometry(ed.r*1.25*sc,32,32);
      var mat=new THREE.MeshPhongMaterial({color:ed.color,shininess:120,specular:new THREE.Color(.6,.6,.6),emissive:new THREE.Color(ed.color).multiplyScalar(.06)});
      var msh=new THREE.Mesh(geo,mat); msh.position.set(a.p[0]*sc+ox,a.p[1]*sc,a.p[2]*sc); msh.userData.e=a.e;
      molGroup.add(msh); atms.push(msh);
    }
    for(var bi=0;bi<mol.bonds.length;bi++){
      var b=mol.bonds[bi],i=b[0],j=b[1],ord=b[2];
      var p1=new THREE.Vector3(mol.atoms[i].p[0]*sc+ox,mol.atoms[i].p[1]*sc,mol.atoms[i].p[2]*sc);
      var p2=new THREE.Vector3(mol.atoms[j].p[0]*sc+ox,mol.atoms[j].p[1]*sc,mol.atoms[j].p[2]*sc);
      var dir=new THREE.Vector3().subVectors(p2,p1),len=dir.length();
      var mid=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(.5);
      var quat=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
      var offs=ord===1?[0]:ord===2?[-.09,.09]:[-.13,0,.13];
      for(var oi=0;oi<offs.length;oi++){
        var bo=offs[oi];
        var bg=new THREE.CylinderGeometry(.055*sc,.055*sc,len,12,1);
        var bm=new THREE.MeshPhongMaterial({color:0xa0b8d0,shininess:60});
        var bme=new THREE.Mesh(bg,bm); bme.position.copy(mid); bme.quaternion.copy(quat);
        if(bo!==0){var perp=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,0,1)).normalize();if(perp.length()<.01)perp=new THREE.Vector3(1,0,0);bme.position.addScaledVector(perp,bo*sc);}
        molGroup.add(bme);
      }
    }
    if(mi<n-1){
      var cv2=document.createElement('canvas'); cv2.width=64; cv2.height=64;
      var ctx=cv2.getContext('2d'); ctx.fillStyle='rgba(80,130,200,.9)'; ctx.font='bold 48px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('+',32,32);
      var spMat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv2),transparent:true,depthTest:false,depthWrite:false});
      var spr=new THREE.Sprite(spMat);
      spr.renderOrder=999; spr.position.set(ox+sp2/2,0,0); spr.scale.set(1.4,1.4,1); molGroup.add(spr);
    }
  }
  var lc=document.getElementById('atomlbls'); lc.innerHTML='';
  for(var li=0;li<atms.length;li++){var lb=document.createElement('div');lb.className='albl';lb.textContent=atms[li].userData.e;lc.appendChild(lb);}
  molGroup.rotation.set(.3,.5,0);
  camera.position.set(0,0,n===1?6:n<=2?8:10); camera.updateProjectionMatrix();
  document.getElementById('mollbl').textContent=valid.map(function(k){return MOLS[k].sym;}).join(' + ')+' — ドラッグで回転';
}

function refreshGrid(){
  var inp=document.getElementById('search');
  var raw=inp?inp.value:'';

  var grid=document.getElementById('mgrid');
  if(!grid) return;
  grid.innerHTML='';
  var allKeys=Object.keys(MOLS);
  var gridKeys=allKeys.filter(function(k){ return unlockedMols[k]; });
  if(q) gridKeys=gridKeys.filter(function(k){ var m=MOLS[k]; return ns(m.sym).indexOf(q)!==-1||( m.ja&&m.ja.toLowerCase().indexOf(q.replace(/[0-9]/g,''))!==-1)||(m.ja&&m.ja.toLowerCase().indexOf(raw.toLowerCase())!==-1); });
  var shown=0;

function doReaction(){
  var reactants=slots.filter(function(s){return s!==null;});
  if(!reactants.length){ toast('物質をスロットに入れてください！'); return; }
  var key=mk(reactants);
  var rxn=null;
  for(var i=0;i<RXNS.length;i++){ if(RXNS[i].key===key&&RXNS[i].cond===selCond){rxn=RXNS[i];break;} }
  var fx=document.getElementById('rxfx');
  fx.style.display='block'; fx.style.animation='none'; void fx.offsetWidth;
  if(rxn){
    fx.textContent=(rxn.fx||'🔥').slice(0,2);
    fx.style.animation='spark .7s ease-out forwards';
    setTimeout(function(){fx.style.display='none';},700);
    var isNew=!doneRxns[rxn.key+rxn.cond];
    // Unlock new molecules
    var newMols=[];
    for(var pi=0;pi<rxn.products.length;pi++){
      var pk=rxn.products[pi];
      if(MOLS[pk]&&!unlockedMols[pk]){ unlockedMols[pk]=true; newMols.push(pk); }
    }
    if(isNew){
      doneRxns[rxn.key+rxn.cond]=true;
      score+=rxn.pts;
      document.getElementById('score').textContent=score;
      updProgress();
      var toastMsg='🎉 '+rxn.name+'  +'+rxn.pts+'pts';
      if(newMols.length>0) toastMsg+='\n🆕 新物質発見：'+newMols.map(function(k){return MOLS[k].sym;}).join('、');
      toast(toastMsg);
      addLog(rxn);
    }
    if(newMols.length>0){
      refreshGrid();
      // Flash new cards
      setTimeout(function(){
        var cards=document.querySelectorAll('.mcard');
        for(var i=0;i<cards.length;i++){
          var sym=cards[i].querySelector('.msym');
          if(sym&&newMols.some(function(k){return MOLS[k].sym===sym.textContent;})){
            cards[i].classList.add('newmol');
            setTimeout(function(c){return function(){c.classList.remove('newmol');};}(cards[i]),1000);
          }
        }
      },100);
    }
    var prods=rxn.products.filter(function(p){return MOLS[p];});
    buildScene(prods);
    if(prods.length>0) showMolInfo(prods[0],rxn);
    saveState();
    if(window.innerWidth<=700) closeDrawer();
    slots=[null,null]; refreshSlots();
    var noteHtml=rxn.note?('<div class="snote"><b>⚖️ 反応の量比</b><br>'+rxn.note+'</div>'):'';
    document.getElementById('info').innerHTML=
      '<div class="req" style="animation:fi .3s">'+rxn.eq+'</div>'+
      '<div class="rname" style="animation:fi .4s">'+rxn.name+'</div>'+
      '<div class="rdesc" style="animation:fi .5s">'+rxn.desc+'</div>'+
      (isNew?'<div class="rpts">🌟 初発見！ +'+rxn.pts+' pts</div>':'<div class="rpts" style="border-color:#508050;color:#70b070">✓ 発見済み</div>')+
      noteHtml+
      '<div class="pcslbl">⬇ 生成物をそのまま使う</div>'+
      '<div class="pcards" id="pca"></div>';
    var pc=document.getElementById('pca');
    for(var qi=0;qi<rxn.products.length;qi++){
      (function(pk){
        var m=MOLS[pk]; if(!m) return;
        var cd=document.createElement('div'); cd.className='pcard';

function showMolInfo(key,rxn){
  var el=document.getElementById('molinfo');
  var m=MOLS[key]; if(!m) return;
  document.getElementById('mi-sym').textContent=m.sym;
  document.getElementById('mi-name').textContent=m.ja;
  document.getElementById('mi-desc').textContent=MOL_INFO[key]||m.ja;
  var rxnEl=document.getElementById('mi-rxn');
  if(rxn&&rxnEl){
    var condObj=CONDS.filter(function(c){return c.id===rxn.cond;})[0]||{ico:'',lbl:''};
    rxnEl.textContent='⚗️ '+rxn.eq+'\n条件：'+condObj.ico+condObj.lbl;
    rxnEl.style.display='block';
  } else if(rxnEl){ rxnEl.style.display='none'; }
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

// ─── SAVE / LOAD ───────────────────────────────────────────────
function saveState(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({score:score,unlocked:Object.keys(unlockedMols),done:Object.keys(doneRxns)}));
    var si=document.getElementById('saveind');
    if(si){si.classList.remove('hide');si.textContent='💾 自動保存済み';clearTimeout(si._t);si._t=setTimeout(function(){si.classList.add('hide');},2500);}
  }catch(e){}
}
function loadState(){
  try{
    var s=localStorage.getItem(SAVE_KEY); if(!s) return false;
    var d=JSON.parse(s);
    if(typeof d.score==='number') score=d.score;
    if(Array.isArray(d.unlocked)) d.unlocked.forEach(function(k){if(MOLS[k]) unlockedMols[k]=true;});
    if(Array.isArray(d.done)) d.done.forEach(function(k){doneRxns[k]=true;});
    return true;
  }catch(e){return false;}
}
function resetState(){
  if(!confirm('進捗をリセットしますか？スコアと発見した反応が全て消えます。')) return;
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  location.reload();
}

// ─── REACTION LOG: click to replay ────────────────────────────
function addLog(rxn){
  var log=document.getElementById('dlog');
  var emp=log.querySelector('.dempty'); if(emp) emp.remove();
  var item=document.createElement('div'); item.className='ditem'; item.style.animation='fi .3s';
  item.textContent=rxn.name+'：'+rxn.eq;
  item.title='クリックして3Dで再表示';
  (function(r){
    item.addEventListener('click',function(){
      var prods=r.products.filter(function(p){return MOLS[p];});
      if(prods.length>0){
        buildScene(prods);
        showMolInfo(prods[0],r);
        if(window.innerWidth<=700) closeDrawer();
      }
    });
  })(rxn);
  log.insertBefore(item,log.firstChild);
}

var _view='3d';
function toggleView(){
  _view=_view==='3d'?'2d':'3d';
  var cv=document.getElementById('threecanvas');
  var svg=document.getElementById('struct2d');
  var btn=document.getElementById('viewtoggle');
  if(_view==='2d'){
    cv.style.display='none'; svg.style.display='block';
    btn.textContent='🔵 3D'; drawStruct2d(_curKeys);
  } else {
    cv.style.display='block'; svg.style.display='none';
    btn.textContent='📐 構造式';
  }

function drawStruct2d(keys){
  var svg=document.getElementById('struct2d');
  if(!svg||_view!=='2d') return;
  var W=svg.clientWidth||400,H=svg.clientHeight||300;
  var valid=(keys||[]).filter(function(k){return k&&MOLS[k];});
  if(!valid.length){svg.innerHTML='<rect width="100%" height="100%" fill="#f5f8ff"/>';return;}
  var n=valid.length,molW=W/n;
  var ACOL={H:'#222',C:'#111',O:'#b52000',N:'#1040bb',S:'#aa8800',Cl:'#006600',Na:'#7733bb',Fe:'#c05000',Ca:'#557755',K:'#663399'};
  var bg='<rect width="'+W+'" height="'+H+'" fill="#f5f8ff"/>';
  var bonds='',aback='',alabel='';
  function fmt(n){return Math.round(n*10)/10;}
  for(var mi=0;mi<n;mi++){
    var mol=MOLS[valid[mi]];
    var baseX=mi*molW;
    if(mol.atoms.length===1){
      var e0=mol.atoms[0].e,cx=baseX+molW/2,cy=H/2;
      var col0=ACOL[e0]||'#111',fw0=e0.length<=1?26:18;
      aback+='<rect x="'+(cx-fw0*0.65*e0.length/2-3)+'" y="'+(cy-fw0*0.55)+'" width="'+(fw0*0.65*e0.length+6)+'" height="'+(fw0*1.1)+'" fill="#f5f8ff"/>';
      alabel+='<text x="'+cx+'" y="'+(cy+fw0*0.38)+'" text-anchor="middle" font-size="'+fw0+'" font-weight="bold" font-family="Arial,Helvetica,sans-serif" fill="'+col0+'">'+e0+'</text>';
      alabel+='<text x="'+cx+'" y="'+(cy+fw0*0.95)+'" text-anchor="middle" font-size="10" fill="#556" font-family="Arial,sans-serif">'+mol.ja.slice(0,10)+'</text>';
      if(mi<n-1) bonds+='<text x="'+(baseX+molW+molW/2)+'" y="'+(H/2+7)+'" text-anchor="middle" font-size="20" fill="#448">+</text>';
      continue;
    }
    var atoms=mol.atoms;
    var xs=atoms.map(function(a){return a.p[0];});
    var ys=atoms.map(function(a){return a.p[1];});
    var xmn=Math.min.apply(null,xs),xmx=Math.max.apply(null,xs);
    var ymn=Math.min.apply(null,ys),ymx=Math.max.apply(null,ys);
    var pad=36;
    var sxr=xmx>xmn?(molW-2*pad)/(xmx-xmn):50;
    var syr=ymx>ymn?(H-2*pad)/(ymx-ymn):50;
    var sc=Math.min(sxr,syr,58);
    var cbx=baseX+molW/2-(xmn+xmx)/2*sc;
    var cby=H/2+(ymn+ymx)/2*sc;
    var px=function(x){return cbx+x*sc;};
    var py=function(y){return cby-y*sc;};
    // ── bonds ──
    for(var bi=0;bi<mol.bonds.length;bi++){
      var b=mol.bonds[bi];
      var a0=atoms[b[0]],a1=atoms[b[1]];
      var bx0=px(a0.p[0]),by0=py(a0.p[1]),bx1=px(a1.p[0]),by1=py(a1.p[1]);
      var ord=b[2];
      var ddx=bx1-bx0,ddy=by1-by0,blen=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      var npx=-ddy/blen,npy=ddx/blen;
      var offsets=ord===1?[0]:ord===2?[-2.2,2.2]:[-3.8,0,3.8];
      for(var oi=0;oi<offsets.length;oi++){
        var oo=offsets[oi];
        bonds+='<line x1="'+fmt(bx0+npx*oo)+'" y1="'+fmt(by0+npy*oo)+'" x2="'+fmt(bx1+npx*oo)+'" y2="'+fmt(by1+npy*oo)+'" stroke="#223" stroke-width="1.7" stroke-linecap="round"/>';
      }
    }
    // ── atom labels ──
    for(var ai=0;ai<atoms.length;ai++){
      var at=atoms[ai];
      var ax=px(at.p[0]),ay=py(at.p[1]);
      var el=at.e,col=ACOL[el]||'#111';
      var fs=el.length<=1?13:11;
      var bw=el.length===1?fs*1.35:el.length*fs*0.72+4;
      var bh=fs*1.55;
      // 白い背景で結合線を「消す」
      aback+='<rect x="'+fmt(ax-bw/2)+'" y="'+fmt(ay-bh*0.55)+'" width="'+fmt(bw)+'" height="'+fmt(bh)+'" fill="#f5f8ff" rx="1"/>';
      alabel+='<text x="'+fmt(ax)+'" y="'+fmt(ay+fs*0.4)+'" text-anchor="middle" font-size="'+fs+'" font-weight="bold" font-family="Arial,Helvetica,sans-serif" fill="'+col+'">'+el+'</text>';
    }
    if(mi<n-1) bonds+='<text x="'+(baseX+molW+molW/2)+'" y="'+(H/2+7)+'" text-anchor="middle" font-size="20" fill="#448">+</text>';
  }
  svg.innerHTML=bg+bonds+aback+alabel;
}

function updateDrop3dSlots(){
  for(var i=0;i<slots.length;i++){
    var el=document.getElementById('d3s'+i); if(!el) continue;
    var k=slots[i];
    if(k&&MOLS[k]){el.textContent=MOLS[k].sym;el.classList.add('filled');}
    else{el.textContent='スロット'+(i+1);el.classList.remove('filled');}
  }
}
function showDrop3d(){document.getElementById('drop3d').style.display='flex';updateDrop3dSlots();}

      var el=document.getElementById('d3s'+idx); if(!el) return;
      el.addEventListener('dragover',function(e){e.preventDefault();el.classList.add('dragover');});
      el.addEventListener('dragleave',function(){el.classList.remove('dragover');});
      el.addEventListener('drop',function(e){
        e.preventDefault();el.classList.remove('dragover');
        var k=e.dataTransfer.getData('text/plain')||dragKey;
        if(k){putSlot(k,idx);hideDrop3d();}
      });
    })(i);
  }
  // Also: drop anywhere on vwrap → add to first empty slot
  var vw=document.getElementById('vwrap');
  vw.addEventListener('dragover',function(e){e.preventDefault();});
  vw.addEventListener('drop',function(e){
    e.preventDefault();
    var k=e.dataTransfer.getData('text/plain')||dragKey;
    if(!k) return;
    var idx=slots.indexOf(null);
    if(idx!==-1) putSlot(k,idx);
    else putSlot(k,slots.length-1);
  });
})();

// ─── MOBILE DRAWER (top-half slide-down) ────────────────────
var _dOpen=false;
function openDrawer(){
  if(window.innerWidth>700) return;
  _dOpen=true;
  var lft=document.getElementById('left');
  var tog=document.getElementById('drawtoggle');
  if(lft) lft.classList.add('open');
  if(tog) tog.classList.add('active');
}
function closeDrawer(){
  if(window.innerWidth>700) return;
  _dOpen=false;
  var lft=document.getElementById('left');
  var tog=document.getElementById('drawtoggle');
  if(lft) lft.classList.remove('open');
  if(tog) tog.classList.remove('active');
}
function toggleDrawer(){
  if(window.innerWidth>700) return;
  if(_dOpen) closeDrawer(); else openDrawer();
}
function showDrawerSec(sec){} // no-op: all sections shown together
function initMobile(){
  if(window.innerWidth>700) return;
  // #sec-rxnを#rightの末尾に移動（反応バーとして常時表示）
  var rxn=document.getElementById('sec-rxn');
  var right=document.getElementById('right');
  if(rxn&&right&&rxn.parentElement&&rxn.parentElement.id!=='right'){
    right.appendChild(rxn);
  }
  // ドロワー内のsec-molにスクロール属性を付与
  var secMol=document.getElementById('sec-mol');
  if(secMol) secMol.style.touchAction='pan-y';
  closeDrawer();
}
window.addEventListener('resize',function(){
  if(window.innerWidth>700){
    // #sec-rxnを#leftに戻す
    var rxn=document.getElementById('sec-rxn');
    var secMol=document.getElementById('sec-mol');
    var left=document.getElementById('left');
    if(rxn&&left&&rxn.parentElement&&rxn.parentElement.id!=='left'){
      if(secMol&&secMol.nextSibling) left.insertBefore(rxn,secMol.nextSibling);
      else if(left) left.appendChild(rxn);
    }
    // スタイルリセット
    var lft2=document.getElementById('left');
    if(lft2){lft2.classList.remove('open');lft2.style.cssText='';}
  } else {
    initMobile();
  }
});  } else { initMobile(); }
});

</script>
